{% extends "base.html" %}

{% block content %}
<div class="bg-white py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center">
            <h2 class="text-3xl font-extrabold text-gray-900 sm:text-4xl">Register a Hospital</h2>
            <p class="mt-3 max-w-2xl mx-auto text-xl text-gray-500">
                Request blood supplies and manage urgent patient requirements.
            </p>
        </div>

        <div class="mt-12 max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <form action="{{ url_for('auth.register', user_type='hospital') }}" method="POST" class="space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label for="first_name" class="block text-sm font-semibold text-gray-800 mb-1">Contact First Name</label>
                        <input type="text" name="first_name" id="first_name" required class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm">
                    </div>
                    <div>
                        <label for="last_name" class="block text-sm font-semibold text-gray-800 mb-1">Contact Last Name</label>
                        <input type="text" name="last_name" id="last_name" required class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <label for="hospital_name" class="block text-sm font-semibold text-gray-800 mb-1">Hospital Name</label>
                    <input type="text" name="hospital_name" id="hospital_name" required class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label for="license_number" class="block text-sm font-semibold text-gray-800 mb-1">License Number</label>
                        <input type="text" name="license_number" id="license_number" required class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm">
                    </div>
                    <div>
                        <label for="emergency_contact" class="block text-sm font-semibold text-gray-800 mb-1">Emergency Contact</label>
                        <input type="text" name="emergency_contact" id="emergency_contact" required class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-800 mb-1">Email</label>
                        <input type="email" name="email" id="email" required class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm">
                    </div>
                    <div>
                        <label for="phone" class="block text-sm font-semibold text-gray-800 mb-1">Phone</label>
                        <input type="text" name="phone" id="phone" required class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <label for="address" class="block text-sm font-semibold text-gray-800 mb-1">Address</label>
                    <textarea name="address" id="address" rows="2" required class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm"></textarea>
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-800 mb-1">Password</label>
                    <input type="password" name="password" id="password" required class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm">
                </div>

                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                    Register Hospital
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
